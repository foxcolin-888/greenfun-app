# 绿趣全流程管理系统 - 腾讯云轻量部署
# 启动：docker compose up -d
# 升级：git pull && docker compose up -d --build
#
# 三大件：
#   app    —— 业务后端（Python 标准库），数据落在持久卷 /data
#   caddy  —— 自动 HTTPS 反向代理（80/443），证书自动申请续期
#   greenfun_data 卷 —— SQLite 数据库 + 上传图片，重启/重建不丢

services:
  app:
    build: .
    image: greenfun-app:latest
    container_name: greenfun-app
    restart: unless-stopped
    environment:
      - PORT=8000
      - DB_PATH=/data/greenfun.db
      - UPLOAD_DIR=/data/uploads
      # —— 生图 API（可选）——
      # 填了这里，后台「系统设置」就无需再手填，且重启不丢；留空则后台手动填。
      - GREENFUN_IMG_GEN_PROVIDER=
      - GREENFUN_IMG_GEN_API_KEY=
      - GREENFUN_IMG_GEN_BASE_URL=
      - GREENFUN_IMG_GEN_MODEL=
      - GREENFUN_IMG_GEN_SIZE=
    volumes:
      - greenfun_data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    container_name: greenfun-caddy
    restart: unless-stopped
    depends_on:
      - app
    # 把 SITE 改成你的域名（Caddyfile 里引用），例如 www.lvqu.com
    environment:
      - SITE=www.lvqu.online, lvqu.online
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./seo:/srv/seo:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  greenfun_data:
  caddy_data:
  caddy_config:
