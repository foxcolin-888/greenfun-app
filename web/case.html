  <style>
    .case-detail { padding: 120px 0 80px; }
    .case-breadcrumb { font-size: 13px; color: var(--green-700); margin-bottom: 22px; }
    .case-breadcrumb a { color: var(--green-700); text-decoration: none; }
    .case-breadcrumb a:hover { text-decoration: underline; }
    .case-hero { position: relative; border-radius: var(--radius); overflow: hidden; min-height: 460px; box-shadow: var(--shadow); display: flex; align-items: flex-end; }
    .case-hero-media { position: absolute; inset: 0; background-size: cover; background-position: center; }
    .case-hero-overlay { position: relative; padding: 46px; color: #fff; background: linear-gradient(transparent, rgba(15,41,24,.9)); width: 100%; }
    .case-hero-overlay h1 { font-family: var(--font-serif); font-size: 40px; margin: 10px 0 12px; }
    .case-hero-overlay p { font-size: 16px; opacity: .9; max-width: 760px; line-height: 1.7; }
    .case-body { max-width: 820px; margin: 48px auto 0; font-size: 16px; line-height: 1.9; color: #2c3a2e; }
    .case-body img { max-width: 100%; border-radius: var(--radius-sm); margin: 18px 0; }
    .case-body h2, .case-body h3 { font-family: var(--font-serif); color: var(--green-900); margin: 28px 0 12px; }
    .case-body p { margin: 12px 0; }
    .case-gallery { margin-top: 44px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .case-gallery img { width: 100%; height: 200px; object-fit: cover; border-radius: var(--radius-sm); cursor: pointer; transition: transform .25s; }
    .case-gallery img:hover { transform: scale(1.03); }
    .case-back { display: inline-block; margin-top: 50px; color: var(--green-700); text-decoration: none; font-weight: 500; }
    .case-back:hover { text-decoration: underline; }
    .case-missing { text-align: center; padding: 120px 0; color: var(--green-700); }
    @media (max-width: 720px) {
      .case-gallery { grid-template-columns: repeat(2, 1fr); }
      .case-hero-overlay h1 { font-size: 28px; }
      .case-hero-overlay { padding: 26px; }
    }
    .img-lightbox { position: fixed; inset: 0; background: rgba(8,20,12,.92); display: none; align-items: center; justify-content: center; z-index: 200; cursor: zoom-out; }
    .img-lightbox.show { display: flex; }
    .img-lightbox img { max-width: 94vw; max-height: 94vh; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  </style>
